# API FastAPI + panel web (Next.js) en local (D-12, D-42).
# Uso: docker compose up --build
#   API   -> http://localhost:8000
#   Panel -> http://localhost:3000
services:
  api:
    build: .
    image: hemiciclo-nlp:local
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./reports:/app/reports:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # La consume el navegador tras publicar: localhost del host.
        NEXT_PUBLIC_HEMICICLO_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      # La consume el servidor Next dentro de la red del compose.
      HEMICICLO_API_URL_SERVER: http://api:8000
    depends_on:
      api:
        condition: service_healthy
